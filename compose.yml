name: cal

services:
  cal:
    build: ./cal
    container_name: cal
    hostname: cal
    restart: unless-stopped
    init: true
    depends_on:
      - proxy
    networks:
      - calnet
    environment:
      TZ: Europe/London
      # All egress rides through squid; calnet itself has no route out.
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      # Swapped to auto mode at cutover; parity with cal.service until then.
      CLAUDE_ARGS: "--dangerously-skip-permissions --continue --channels plugin:telegram@claude-plugins-official"
    volumes:
      - /home/padraig/cal-home:/home/cal
      - /home/padraig/git/pa:/home/cal/pa
      - /home/padraig/git/Obsidian-Vault-PMK:/home/cal/vault
      - /home/padraig/git/pa-infra:/home/cal/pa-infra

  proxy:
    image: ubuntu/squid:latest
    container_name: calproxy
    restart: unless-stopped
    networks:
      - calnet
      - egress
    volumes:
      # Deploy-clone copies (root-owned): the *running* allowlist is the one
      # in /root/pa-infra, never Cal's working copy.
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro

networks:
  # internal: true = no gateway to the outside world. Egress denied by
  # topology, not by a firewall rule that could be mis-ordered.
  calnet:
    internal: true
  egress: {}
