name: cal

services:
  cal:
    build: ./cal
    container_name: cal
    hostname: cal
    restart: unless-stopped
    init: true
    depends_on:
      - proxy
    # Hardening (2026-11-01). The entrypoint runs as root only to install
    # Cal's crontab, start cron and runuser into tmux — so it keeps the
    # SETUID/SETGID/CHOWN family and loses the default caps it never uses.
    # no-new-privileges means setuid binaries don't elevate: Cal (uid 1000)
    # has no route back to root inside the container. Side effect: `crontab`
    # as cal fails (it's setgid) — the entrypoint installs the schedule.
    security_opt:
      - no-new-privileges:true
    cap_drop: [NET_RAW, MKNOD, SYS_CHROOT, SETFCAP, NET_BIND_SERVICE, FSETID]
    # 4 GB host: leave room for sshd, tailscaled, syncthing. Idle ~350 MB.
    mem_limit: 2560m
    pids_limit: 512
    networks:
      - calnet
    environment:
      TZ: Europe/London
      # All egress rides through squid; calnet itself has no route out.
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      # NB: do not set CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC here — the
      # channels feature (Telegram) is gated on that "nonessential" flag
      # traffic and reports "Channels are not currently available" without it.
      # Auto mode (since cutover 2026-08-10): deny rules hold, ask rules relay
      # to Telegram as approval prompts, classifier gates the rest.
      CLAUDE_ARGS: "--permission-mode auto --continue --channels plugin:telegram@claude-plugins-official --dangerously-load-development-channels server:calweb"
    volumes:
      - /home/padraig/cal-home:/home/cal
      - /home/padraig/git/pa:/home/cal/pa
      - /home/padraig/git/Obsidian-Vault-PMK:/home/cal/vault
      - /home/padraig/git/pa-infra:/home/cal/pa-infra

  proxy:
    image: ubuntu/squid:latest
    container_name: calproxy
    restart: unless-stopped
    # Squid starts as root and drops to `proxy`; that's all the caps it needs.
    # pinger (setuid, needs NET_RAW) is disabled in squid.conf.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    mem_limit: 256m
    pids_limit: 128
    networks:
      - calnet
      - egress
    # Mount the whole directory, not single files: single-file bind mounts pin
    # the inode, so in-place file replacement (sed -i, git) goes stale.
    volumes:
      # Deploy-clone copy (root-owned): the *running* allowlist is the one
      # in /root/pa-infra, never Cal's working copy.
      - ./proxy:/etc/squid/pa:ro
    command: ["-f", "/etc/squid/pa/squid.conf", "-NYC"]

  # Voice mode (pa/research/voice-conversation-mode.md). Docker publishes no
  # ports for a container that is only on an internal network, so this relay
  # straddles calnet and voicein and forwards host 127.0.0.1:8765 -> cal:8765.
  # Host loopback only: the phone reaches it via `tailscale serve`, never the
  # public internet. The voice server also requires its own token.
  voicegw:
    image: alpine/socat:latest
    container_name: calvoicegw
    restart: unless-stopped
    # A byte relay needs no privileges at all.
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 64
    networks:
      - calnet
      - voicein
    ports:
      - "127.0.0.1:8765:8765"
    command: ["TCP-LISTEN:8765,fork,reuseaddr", "TCP:cal:8765"]

networks:
  # internal: true = no gateway to the outside world. Egress denied by
  # topology, not by a firewall rule that could be mis-ordered.
  calnet:
    internal: true
  egress: {}
  # Exists only so voicegw can publish a port; nothing initiates out of it.
  voicein: {}
