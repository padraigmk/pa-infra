# Squid egress proxy for the cal container.
# Deny-by-default: only domains listed in allowed-domains.txt, only ports 80/443.

http_port 3128

acl allowed_domains dstdomain "/etc/squid/pa/allowed-domains.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# No caching (no cache_dir configured = memory-only, and deny disables that
# too). The image entrypoint tails /var/log/squid/*.log to container stdout.
cache deny all
access_log /var/log/squid/access.log squid

# Don't advertise internal details.
httpd_suppress_version_string on
via off
forwarded_for delete
