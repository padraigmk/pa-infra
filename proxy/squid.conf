# Squid egress proxy for the cal container.
# Deny-by-default: only domains listed in allowed-domains.txt, only ports 80/443.

http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# No caching, no disk state; logs to container stdout for docker logs.
cache deny all
cache_dir null /tmp
access_log stdio:/dev/stdout
cache_log /dev/null

# Don't advertise internal details.
httpd_suppress_version_string on
via off
forwarded_for delete
